<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Musiques du jeu</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --bg: #1b1b22; --card: #fbf8ee; --ink: #2c2c36; --blue: #34506e; --accent: #c0405a; --muted: #5a5a68; }
  body { margin: 0; background: var(--bg); font-family: 'VT323', monospace; color: var(--ink); }
  main { max-width: 620px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { color: #fff3c8; font-size: 40px; margin: 0 0 4px; text-shadow: 2px 2px 0 #b0405e; }
  p.intro, .note { color: #a9cbe6; font-size: 20px; margin: 0 0 16px; }
  section { background: var(--card); border: 4px solid var(--blue); border-radius: 10px; padding: 12px 14px 6px; margin-bottom: 18px; }
  section h2 { margin: 0; font-size: 30px; color: var(--accent); }
  section .where { font-size: 19px; color: var(--muted); margin: 0 0 8px; line-height: 1.1; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 0 12px; align-items: center; border-top: 2px dashed #d8d2c0; padding: 8px 0; }
  .row b { font-size: 23px; font-weight: normal; }
  .row b .tag { display: inline-block; min-width: 76px; color: var(--blue); }
  .row span.desc { grid-column: 1; font-size: 18px; color: var(--muted); }
  button { grid-column: 2; grid-row: 1 / span 2; font: inherit; font-size: 24px; width: 104px; height: 48px;
           border: 3px solid #1c1a2a; border-radius: 8px; background: #4f78b0; color: #fff; cursor: pointer; }
  button.on { background: var(--accent); }
  button:focus-visible { outline: 3px solid #f0c830; outline-offset: 2px; }
  .row.current b .tag { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Musiques du jeu</h1>
  <p class="intro">Pour chaque moment du jeu : la version d'origine, puis les alternatives. Celle en rouge avec « (dans le jeu) » est celle qui joue actuellement. Une seule musique joue à la fois, en boucle.</p>
  <p id="status" class="note" role="status"></p>
  <div id="list"></div>
</main>
<script type="module">
  import { unlock, music, isMuted, setMuted, audioState, CHOICE } from './js/engine/audio.js';
  import { ALT } from './js/engine/musiques_alt.js';
  const MOMENTS = [
    ['title', '0. Menu', 'L\'écran-titre (au lancement du jeu et au retour au titre)', 'Joyeuse, « début d\'aventure »'],
    ['home', '1. Maison', 'L\'appart (rez-de-chaussée, étage), la salle de TP du lycée', 'Calme et chaleureuse, tempo moyen'],
    ['town', '2. Ville', 'La rue, la place du marché, l\'épicerie, le poste électrique par beau temps', 'Sautillante, plus rapide'],
    ['storm', '3. Tempête', 'Le chapitre 5 sous l\'orage : rue, poste, parc éolien avant la relance', 'Tendue, en mineur'],
    ['final', '4. Final', 'Le lit au chapitre 4, le parc éolien, le final et le générique', 'Tendre et lente'],
  ];
  const list = document.getElementById('list'), status = document.getElementById('status');
  const buttons = [];
  function play(id, b) {
    unlock();
    // si le son avait été coupé dans le menu du jeu, on le réactive (sinon on n'entendrait rien)
    if (isMuted()) { setMuted(false); status.textContent = 'Le son était coupé dans le menu du jeu : je l\'ai réactivé.'; }
    setTimeout(() => { if (audioState() !== 'running') status.textContent = 'Le navigateur bloque le son. Vérifie le volume de l\'ordinateur, puis réessaie.'; }, 400);
    const playing = music.current() === id;
    music.play(playing ? null : id);
    for (const x of buttons) { x.classList.remove('on'); x.textContent = 'Écouter'; }
    if (!playing) { b.classList.add('on'); b.textContent = 'Stop'; }
  }
  function row(sec, id, tag, name, desc, isCurrent) {
    const d = document.createElement('div');
    d.className = 'row' + (isCurrent ? ' current' : '');
    d.innerHTML = `<b><span class="tag">${tag}</span>${name}${isCurrent ? ' (dans le jeu)' : ''}</b><span class="desc">${desc}</span>`;
    const b = document.createElement('button');
    b.textContent = 'Écouter'; b.onclick = () => play(id, b);
    buttons.push(b); d.appendChild(b); sec.appendChild(d);
  }
  for (const [key, title, where, mood] of MOMENTS) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${title}</h2><p class="where">${where}</p>`;
    row(sec, key + '_o', 'Origine', '', mood, CHOICE[key] === key);
    for (const id of Object.keys(ALT).filter(k => k.startsWith(key + '_'))) {
      const t = ALT[id];
      row(sec, id, id.split('_')[1].toUpperCase(), t.name, t.desc, CHOICE[key] === id);
    }
    list.appendChild(sec);
  }
</script>
</body>
</html>
